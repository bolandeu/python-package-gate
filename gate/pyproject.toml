[project]
name = "rb-gate"
# Version comes from the git tag vX.Y.Z (uv-dynamic-versioning) — never add `version =`.
# The gate and the template share one tag: a package runs the gate of the tag it was generated from.
dynamic = ["version"]
description = "The release gate of the CLI standard: gate check, run over the package in the current directory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.27,<0.29"]

[project.urls]
Repository = "https://github.com/bolandeu/python-package-gate"

[project.scripts]
gate = "rb_gate.cli:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["rb_gate", "standard"]
exclude = ["standard/tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",  # also the fixture packages' pytest (tests put this venv on PATH)
    "pytest-cov>=5.0",  # the contracts step runs pytest with --no-cov
    "ruff>=0.6",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
testpaths = ["tests", "standard"]
addopts = "--ignore=tests/data"  # data/: fixture projects with their own tests
markers = ["network: needs the network (osv-scanner queries osv.dev)"]

[tool.ty.terminal]
error-on-warning = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"{tests,standard/tests}/*" = ["S101"]  # assert is the point of a test
"rb_gate/gate.py" = ["S603", "S607"]  # the gate runs fixed argv lists (git, uv, ruff), no shell

[tool.ruff.lint.flake8-bugbear]
# Typer's `param: T = typer.Option(...)` style is a call in a default on purpose.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
