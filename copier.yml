_subdirectory: template

# Project-owned after generation: `copier update` must not merge template
# prose into a README the project has rewritten.
_skip_if_exists:
  - "README.md"
  - "tests/help_allowlist.txt"

_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # Antagor's own files (`antagor new`, `antagor upgrade --apply`): the template neither ships nor touches them.
  - "CLAUDE.md"
  - "docs/adr/README.md"
  - ".agents/antagor/.gitignore"
  # A part added after the first release drops its files only when its answer is false: copier renders the
  # previous version with these patterns too (to keep what they exclude), and there that answer is undefined.
  - "{% if include_project is false %}src/{{ package_name }}/commands/project.py{% endif %}"
  - "{% if include_project is false %}src/{{ package_name }}/commands/init.py{% endif %}"
  - "{% if include_project is false %}src/{{ package_name }}/commands/config.py{% endif %}"
  - "{% if include_project is false %}src/{{ package_name }}/commands/status.py{% endif %}"
  - "{% if include_project is false %}src/{{ package_name }}/core/services.py{% endif %}"
  - "{% if include_project is false %}src/{{ package_name }}/core/models.py{% endif %}"
  - "{% if include_project is false %}tests/test_project.py{% endif %}"
  - "{% if include_project is false %}tests/test_services.py{% endif %}"
  - "{% if not include_auth %}src/{{ package_name }}/commands/login.py{% endif %}"
  - "{% if not include_auth %}src/{{ package_name }}/credentials{% endif %}"
  - "{% if not include_auth %}tests/test_auth.py{% endif %}"
  - "{% if not include_providers %}src/{{ package_name }}/providers{% endif %}"
  - "{% if not include_providers %}tests/test_providers.py{% endif %}"
  - "{% if not (include_providers and include_http_provider) %}src/{{ package_name }}/providers/http.py{% endif %}"
  - "{% if not (include_providers and include_http_provider) %}tests/test_http_provider.py{% endif %}"
  - "{% if not include_db %}src/{{ package_name }}/core/db.py{% endif %}"
  - "{% if not include_db %}src/{{ package_name }}/core/tables.py{% endif %}"
  - "{% if not include_db %}src/{{ package_name }}/core/normalize.py{% endif %}"
  - "{% if not include_db %}src/{{ package_name }}/migrations{% endif %}"
  - "{% if not include_db %}src/{{ package_name }}/commands/db.py{% endif %}"
  - "{% if not include_db %}tests/test_db.py{% endif %}"
  - "{% if not include_db %}tests/test_normalize.py{% endif %}"
  - "{% if not include_db %}scripts/pg_test.sh{% endif %}"
  - "{% if include_skill is false %}src/{{ package_name }}/commands/skill.py{% endif %}"
  - "{% if include_skill is false %}src/{{ package_name }}/core/skills.py{% endif %}"
  - "{% if include_skill is false %}src/{{ package_name }}/data{% endif %}"
  - "{% if include_skill is false %}tests/test_skills.py{% endif %}"
  - "{% if include_describe is false %}src/{{ package_name }}/commands/describe.py{% endif %}"
  - "{% if include_describe is false %}src/{{ package_name }}/core/opencli.py{% endif %}"
  - "{% if include_describe is false %}src/{{ package_name }}/core/data_files.py{% endif %}"
  - "{% if include_describe is false %}tests/test_describe.py{% endif %}"
  - "{% if include_describe is false %}tests/data/opencli.schema.json{% endif %}"
  - "{% if include_contracts is false %}tests/contracts{% endif %}"
  - "{% if include_contracts is false %}tests/data/contracts{% endif %}"
  - "{% if include_contracts is false %}tests/test_contracts.py{% endif %}"
  - "{% if include_contracts is false %}tests/test_contract_runner.py{% endif %}"
  - "{% if include_contracts is false %}tests/test_detach.py{% endif %}"
  - "{% if include_contracts is false %}scripts/detach.py{% endif %}"
  - "{% if include_contracts is false %}scripts/run_detached.sh{% endif %}"
  - "{% if include_contracts is false %}scripts/runs_status.sh{% endif %}"
  - "{% if include_describe is false and not include_contracts %}tests/data{% endif %}"
  # Migrations are the project's own history once generated: on `copier update` the
  # template's example revisions must never land in a tool's chain (a second 0002...).
  - "{% if _copier_operation == 'update' %}src/{{ package_name }}/migrations/versions{% endif %}"

# The --help and describe snapshots (tests/snapshots/) contain the CLI's name and
# wrap around it, so they're rendered in the generated project, not shipped.
_tasks:
  - command: "uv run --quiet pytest --snapshot-update --no-cov -q -p no:cacheprovider tests/test_help.py{% if include_describe %} tests/test_describe.py{% endif %}"
    when: "{{ _copier_operation == 'copy' }}"

# The project's answers before this run: the file is there on `copier update` only (see `updating`;
# on `copier copy` copier warns MissingFileWarning). Copier 9.19 gives `_copier_operation` to _exclude and
# _tasks, not to a question's default.
_external_data:
  previous_answers: "{{ _copier_conf.answers_file }}"

package_name:
  type: str
  help: "Python import package (snake_case). Standard §10 for new tools: rb_<slug>, e.g. rb_serp"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    package_name must be a valid snake_case Python identifier
    {% endif %}

cli_name:
  type: str
  help: "Command users type (the [project.scripts] name), if it differs from the package name (e.g. sitemap-xml for package rb_sitemap_xml)"
  default: "{{ package_name | regex_replace('^rb_', '') | replace('_', '-') }}"
  validator: >-
    {% if not (cli_name | regex_search('^[a-z][a-z0-9_-]*$')) %}
    cli_name must be lowercase letters, digits, '-' or '_'
    {% endif %}

antagor_prefix:
  type: str
  help: "Antagor task prefix: a capital letter, then 1-9 capitals or digits (tasks are <PREFIX>-001), e.g. MEDIAGEN"
  default: >-
    {%- set from_cli = cli_name | upper | regex_replace('[^A-Z]', '') -%}
    {%- set from_pkg = package_name | upper | regex_replace('[^A-Z]', '') -%}
    {{ (from_cli if from_cli | length >= 2 else (from_pkg if from_pkg | length >= 2 else 'TL'))[:3] }}
  validator: >-
    {% if not (antagor_prefix | regex_search('^[A-Z][A-Z0-9]{1,9}$')) %}
    antagor_prefix must be a capital letter, then 1-9 capitals or digits
    {% endif %}

dist_name:
  type: str
  help: "Distribution name ([project] name; what `uv tool install` and dependencies use). Standard §10: rb-<slug> for import package rb_<slug>"
  default: "rb-{{ package_name | regex_replace('^rb_', '') | replace('_', '-') }}"
  validator: >-
    {% if not (dist_name | regex_search('^[a-z][a-z0-9._-]*$')) %}
    dist_name must be lowercase letters, digits, '.', '-' or '_'
    {% endif %}

dist_name_legacy:
  type: str
  help: "Previous distribution name while renaming to dist_name (standard §10) — installs made under it keep reporting their version; blank when not renaming"
  default: ""

project_name:
  type: str
  help: "Display name for the project"
  default: "{{ package_name }}"

description:
  type: str
  help: "One-sentence description of what this CLI does"
  default: "Project-aware automation CLI"

author_name:
  type: str
  help: "Author name for pyproject.toml"
  default: "Unknown"

# Not a question: true on `copier update`, false on `copier copy` (ADR 0014). An optional part added after
# the first release defaults to it: off in a new package, on in a package made before the part was a question.
updating:
  type: bool
  default: "{{ _external_data.previous_answers._commit is defined }}"
  when: false

include_project:
  type: bool
  help: "Work on a project directory with its own settings (.<package>/config.toml; `init`, `config`, `status`, --project)?"
  default: "{{ updating }}"

include_auth:
  type: bool
  help: "Keep credentials (keychain and env; `auth login`/`logout`, providers in `auth status`)?"
  default: false

include_providers:
  type: bool
  help: "Include providers/ (a provider per external service, its health check in `auth status`)? Only a CLI without credentials can do without it"
  default: "{{ include_auth or updating }}"
  when: "{{ not include_auth }}"
  validator: >-
    {% if include_auth and not include_providers %}
    include_auth needs include_providers (auth status checks providers)
    {% endif %}

include_http_provider:
  type: bool
  help: "Include providers/http.py (HttpProvider: shared httpx client, retries, error mapping, the 10 s health probe)? No if no provider speaks HTTP"
  default: true
  when: "{{ include_providers }}"

include_db:
  type: bool
  help: "Keep data in a database (core/db.py: shared PostgreSQL from <TOOL>_DATABASE_URL, else local SQLite; Alembic migrations; `db` commands)?"
  default: false

include_skill:
  type: bool
  help: "Ship an agent skill for agents in other projects (data/SKILL.md; `skill install`, `skill list`, --ai)?"
  default: "{{ updating }}"

include_describe:
  type: bool
  help: "Print the CLI as an OpenCLI document (`describe --json`) for the tools catalog or clidocs?"
  default: "{{ updating }}"

include_contracts:
  type: bool
  help: "Run consumers' contracts (tests/contracts/) and long commands detached (scripts/run_detached.sh)? Contracts read `describe --json`"
  default: "{{ include_describe and updating }}"
  when: "{{ include_describe }}"

# Not a question: the release gate, pinned to the template tag of the project (`_commit`). A package runs it
# through uvx — never a copy in the project, never a dependency.
# It is the only gate, and it is local: `[publish] gate_command` in
# `.agents/antagor/antagor.toml` and the docs render it.
gate_command:
  type: str
  default: 'uvx --from "git+https://homeserver.tailee01ab.ts.net:3000/bolandeu/cli-generator.git@{{ _copier_answers._commit }}#subdirectory=gate" gate check'
  when: false

repository_url:
  type: str
  help: "GitHub mirror URL of this package (e.g. https://github.com/bolandeu/mycli); Gitea is the primary store, the mirror is private and nobody pushes to it — fills the `uv tool install git+…` command in README.md/SKILL.md; leave blank for a placeholder"
  default: ""

# The Antagor project name: the package's folder name, which is also its Gitea repository name (repository_url is
# the GitHub mirror, its name can differ). On `copier update` `_copier_conf.dst_path` is a temporary folder or `.`,
# so the default renders what the template wrote before this question, the command: the merge keeps the package's
# line. The answer is kept.
antagor_name:
  type: str
  help: "Antagor project name: the package's folder name, which is also its Gitea repository name"
  default: "{{ cli_name if updating else _copier_conf.dst_path | realpath | basename }}"

install_homeserver_users:
  type: str
  help: "Homeserver users the tool-updater installs this tool for, comma-separated ([tool.rb.install] homeserver); blank = build and publish only"
  default: "rbtools"

install_mac:
  type: bool
  help: "Install this tool on the Mac too ([tool.rb.install] mac)?"
  default: true
